<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Single-mesh animals: Pawprint Park experiment mockup</title>
    <style>
      :root {
        --ink: #3b2f25;
        --paper: #fff8ec;
        --accent: #e08a3a;
        --muted: #8a7a66;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f1dfc0;
        color: var(--ink);
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      canvas#view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #panel {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
        width: 290px;
        max-height: calc(100% - 24px);
        overflow: auto;
        background: color-mix(in srgb, var(--paper) 92%, transparent);
        border-radius: 18px;
        padding: 14px 16px;
        box-shadow: 0 6px 24px rgb(80 50 20 / 0.18);
        backdrop-filter: blur(6px);
      }
      #panel.hidden {
        display: none;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 2px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 10px;
        font-size: 12.5px;
      }
      .group {
        margin: 10px 0 0;
      }
      .label {
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        font: inherit;
        color: var(--ink);
        background: #f3e6cf;
        border: 0;
        border-radius: 999px;
        padding: 6px 11px;
        min-height: 32px;
        cursor: pointer;
      }
      button:hover {
        background: #ecd9b8;
      }
      button[aria-pressed='true'] {
        background: var(--accent);
        color: white;
      }
      button:focus-visible {
        outline: 3px solid #5a8ad8;
        outline-offset: 1px;
      }
      kbd {
        font: 11px ui-monospace, monospace;
        background: #eadcc4;
        border-radius: 4px;
        padding: 0 4px;
      }
      .keys {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .tag {
        font: 600 13px/1.2 system-ui, sans-serif;
        color: var(--ink);
        background: color-mix(in srgb, var(--paper) 88%, transparent);
        padding: 3px 9px;
        border-radius: 999px;
        white-space: nowrap;
        pointer-events: none;
        box-shadow: 0 2px 8px rgb(80 50 20 / 0.15);
      }
      .tag small {
        font-weight: 400;
        color: var(--muted);
      }
      .sign {
        font: 700 15px/1.2 system-ui, sans-serif;
        color: white;
        background: #7a5a3a;
        padding: 5px 12px;
        border-radius: 8px;
        pointer-events: none;
        white-space: nowrap;
      }
      .sign small {
        display: block;
        font-weight: 400;
        font-size: 11.5px;
        opacity: 0.85;
      }
      #toggle {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
      }
      #stats {
        position: fixed;
        right: max(12px, env(safe-area-inset-right));
        bottom: max(12px, env(safe-area-inset-bottom));
        font: 11px ui-monospace, monospace;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel" role="region" aria-label="Mockup controls">
      <h1>Single-mesh animals</h1>
      <p class="sub">Experiment: one skinned, subdivided mesh per animal (right of each pair) next to the current builder (left).</p>
      <div class="group">
        <div class="label">Species</div>
        <div class="row" id="species"></div>
      </div>
      <div class="group">
        <div class="label">View</div>
        <div class="row" id="views"></div>
      </div>
      <div class="group">
        <div class="label">Pose</div>
        <div class="row" id="poses"></div>
      </div>
      <div class="group">
        <div class="label">Builders</div>
        <div class="row" id="builders"></div>
      </div>
      <div class="group">
        <div class="label">Quality</div>
        <div class="row" id="quality"></div>
      </div>
      <div class="keys">
        <kbd>1</kbd>–<kbd>4</kbd> pose · <kbd>←</kbd><kbd>→</kbd> species · <kbd>V</kbd> view · <kbd>B</kbd> builders ·
        <kbd>W</kbd> wireframe · <kbd>Q</kbd> quality · <kbd>H</kbd> hide panel. Drag to orbit, scroll or pinch to zoom.
      </div>
    </div>
    <button id="toggle" aria-label="Show or hide the controls">☰</button>
    <div id="stats" aria-hidden="true"></div>
    <script type="module" src="./single-mesh.js"></script>
  </body>
</html>
